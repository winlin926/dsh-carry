name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm ci --prefix remote-server --ignore-scripts --no-audit --no-fund
      - run: pnpm lint
      - run: pnpm typecheck
      - run: npm --prefix remote-server run typecheck
      - run: pnpm test
      - run: npm --prefix remote-server test
      - run: pnpm build
      - run: npm pack --dry-run --ignore-scripts --json > package-manifest.json
      - run: node scripts/check-package.mjs package-manifest.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build remote-server image
        run: docker build -f remote-server/Dockerfile -t dsh-remote-server:ci .
      - name: Smoke test container
        run: |
          docker run -d --name dsh-ci -p 8787:8787 dsh-remote-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz -o /tmp/healthz; then
              break
            fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/healthz
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<!doctype html>'
          test "$(docker inspect -f '{{.Config.User}}' dsh-ci)" = node
      - name: Container logs
        if: failure()
        run: docker logs dsh-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f dsh-ci || true
