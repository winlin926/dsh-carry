<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>DSH Remote 配对</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #141a24;
        --line: #26303d;
        --text: #e6edf3;
        --muted: #8b98a9;
        --accent: #4c9aff;
        --ok: #3fb950;
        --bad: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% -10%, #1b2433, var(--bg) 60%);
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem 2rem;
      }
      header { width: 100%; max-width: 26rem; margin-bottom: 1.5rem; }
      .brand { display: flex; align-items: center; gap: .55rem; font-weight: 600; letter-spacing: .02em; }
      .brand button { flex: none; margin-inline-start: auto; }
      .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 3px rgba(139,152,169,.15); }
      .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
      .dot.bad { background: var(--bad); }
      .node-line { margin-top: .45rem; color: var(--muted); font-size: .82rem; word-break: break-all; }
      main { width: 100%; max-width: 26rem; }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--panel);
        border: 1px solid var(--line);
        border-radius: .9rem;
        padding: 1.4rem;
      }
      .card h2 { margin: 0 0 .8rem; font-size: 1.05rem; }
      .card p { margin: .5rem 0; color: var(--muted); }
      dl { margin: 1rem 0; display: grid; grid-template-columns: auto 1fr; gap: .45rem .8rem; font-size: .86rem; }
      dt { color: var(--muted); white-space: nowrap; }
      dd { margin: 0; word-break: break-all; }
      dd.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .06rem; }
      .row { display: flex; gap: .7rem; margin-top: 1.2rem; }
      button {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: .55rem;
        background: transparent;
        color: var(--text);
        font: inherit;
        padding: .62rem .8rem;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
      button:disabled { opacity: .5; cursor: progress; }
      .status { margin-top: 1rem; min-height: 1.4rem; color: var(--muted); font-size: .84rem; }
      .status.ok { color: var(--ok); }
      .status.bad { color: var(--bad); }
      footer { margin-top: 1.6rem; max-width: 26rem; color: var(--muted); font-size: .76rem; line-height: 1.7; text-align: center; }
      .host { border: 1px solid var(--line); border-radius: .7rem; padding: .9rem 1rem 0; background: rgba(0,0,0,.18); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="dot" id="dot" aria-hidden="true"></span><span>DSH Remote</span><button type="button" id="language" lang="en">English</button></div>
      <div class="node-line" id="node-name">公网节点</div>
    </header>

    <main>
      <section class="card" id="idle">
        <h2 data-text="scanTitle">等待配对二维码</h2>
        <p data-text="scan">请在电脑的「远程控制」面板生成二维码，再用手机扫描。</p>
        <p data-text="once">二维码在有效期内只能使用一次。</p>
      </section>

      <section class="card" id="confirm" hidden>
        <h2 data-text="confirmTitle">确认配对</h2>
        <p data-text="compare">请核对指纹与电脑端显示的一致。手机确认后，还须在电脑端批准。</p>
        <div class="host">
          <dl>
            <dt data-text="node">公网节点</dt><dd id="confirm-name"></dd>
            <dt data-text="kind">类型</dt><dd id="confirm-type"></dd>
            <dt data-text="fingerprint">目标主机指纹</dt><dd class="mono" id="host-fp"></dd>
            <dt data-text="expiry">有效期</dt><dd id="expires"></dd>
          </dl>
        </div>
        <div class="row">
          <button type="button" id="reject" data-text="reject" disabled>拒绝</button>
          <button type="button" id="approve" class="primary" data-text="approve" disabled>确认是本机</button>
        </div>
      </section>

      <section class="card" id="done" hidden>
        <h2 data-text="doneTitle">配对完成</h2>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <button type="button" id="retry" data-text="retry" hidden>重试</button>
    </main>

    <footer data-text="trust">
      节点终止 TLS，运营者可能看到转发的内容。本服务不提供端到端加密。请只使用你信任的节点。
    </footer>

    <script>
      'use strict'

      const $ = id => document.getElementById(id)
      const TICKET = /^[A-Za-z0-9_-]{43}$/
      const IDENTITY_KEY = /^[A-Za-z0-9_-]{40,120}$/
      const CROCKFORD = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'
      const IDENTITY_STORAGE = 'dsh-pairing-identity'
      const copy = {
        title: ['DSH Remote 配对', 'Pair with DSH Remote'],
        scanTitle: ['等待配对二维码', 'Scan a pairing QR code'],
        scan: ['请在电脑的「远程控制」面板生成二维码，再用手机扫描。', 'Generate a QR code in the Remote Control panel on your computer, then scan it with your phone.'],
        once: ['二维码在有效期内只能使用一次。', 'The QR code can be used once before it expires.'],
        trust: ['节点终止 TLS，运营者可能看到转发的内容。本服务不提供端到端加密。请只使用你信任的节点。', 'TLS terminates at the relay. The operator may see forwarded content. This service does not provide end-to-end encryption. Use a relay you trust.'],
        confirmTitle: ['确认配对', 'Confirm pairing'],
        compare: ['请核对指纹与电脑端显示的一致。手机确认后，还须在电脑端批准。', 'Compare the fingerprint with the one on your computer. Pairing requires approval on both devices.'],
        node: ['公网节点', 'Public relay'],
        kind: ['类型', 'Type'],
        fingerprint: ['目标主机指纹', 'Computer fingerprint'],
        expiry: ['有效期', 'Expires at'],
        gateway: ['隧道网关', 'Tunnel gateway'],
        relay: ['自托管服务', 'Self-hosted relay'],
        reject: ['拒绝', 'Reject'],
        approve: ['确认是本机', 'Confirm this computer'],
        retry: ['重试', 'Try again'],
        doneTitle: ['配对完成', 'Paired'],
        browser: ['网页浏览器', 'Web browser'],
        connecting: ['正在连接中继…', 'Connecting to the relay…'],
        requesting: ['正在向电脑发起配对…', 'Requesting pairing with the computer…'],
        compareStatus: ['指纹一致时，点击「确认是本机」。', 'Confirm only if the fingerprints match.'],
        confirming: ['正在提交手机确认…', 'Sending your confirmation…'],
        rejecting: ['正在提交拒绝…', 'Sending your rejection…'],
        waiting: ['已在手机上确认，请在电脑上批准。', 'Confirmed on this phone. Approve the request on your computer.'],
        checking: ['正在查询原配对申请…', 'Checking the existing pairing request…'],
        checkFailed: ['暂时无法获取结果。网络恢复后可查询这次申请。', 'The result is unavailable. Check this request again when your connection returns.'],
        decisionPending: ['节点尚未收到手机的选择，请核对指纹后重新确认或拒绝。', 'The relay has no decision from this phone yet. Compare the fingerprint, then confirm or reject.'],
        opening: ['配对完成，正在打开电脑上的 DSH。', 'Paired. Opening DSH on your computer…'],
        expired: ['配对二维码或申请已失效。请在电脑上生成新二维码后扫描。', 'This QR code or request is no longer valid. Generate a new QR code on your computer and scan it.'],
        rejected: ['这次配对已被拒绝。需要连接时，请在电脑上生成新二维码。', 'This request was rejected. Generate a new QR code on your computer when you want to connect.'],
        invalid: ['无法识别这个二维码。请在电脑上生成新二维码后扫描。', 'This QR code is invalid. Generate a new QR code on your computer and scan it.'],
        nodeUnavailable: ['暂时无法连接中继。请检查网络后重试。', 'The relay is unreachable. Check your network and try again.'],
        identityUnavailable: ['浏览器无法加载设备身份。请用支持 WebCrypto 和网站存储的浏览器重新扫码。', 'This browser could not load its device identity. Scan again in a browser with WebCrypto and site storage enabled.'],
        mismatch: ['主机指纹和二维码不一致。请在电脑上核对后重新扫码。', 'The computer fingerprint differs from the QR code. Check it on your computer and scan again.'],
        deviceMismatch: ['此浏览器的设备身份与现有授权不一致。请在电脑上核对已授权设备。', 'This browser has a different identity from the existing pairing. Check paired devices on your computer.'],
        hostOffline: ['电脑尚未连上中继。请在电脑上确认远程连接已开启，再扫码。', 'The computer is offline. Turn on the remote connection on your computer, then scan again.'],
        claimUnknown: ['未收到申请结果。请在电脑上检查待确认的申请，拒绝旧申请后生成新二维码。', 'No pairing result arrived. Check for a pending request on your computer, reject it if present, and generate a new QR code.'],
        sessionMissing: ['双方已确认，但浏览器未取得这台电脑的访问权限。请在电脑上生成新二维码后扫描。', 'Both devices approved pairing, but this browser could not access the computer. Generate a new QR code on your computer and scan it.'],
      }
      let language = /^zh(?:-|$)/i.test(navigator.language) ? 'zh-CN' : 'en'
      const t = key => copy[key][language === 'zh-CN' ? 0 : 1]

      let node
      let expiresAt
      let statusKey = ''
      let statusKind

      function setStatus(key, kind) {
        statusKey = key
        statusKind = kind
        const el = $('status')
        const text = key ? t(key) : ''
        if (el.textContent !== text) el.textContent = text
        el.className = 'status' + (kind ? ' ' + kind : '')
      }

      function renderLanguage() {
        document.documentElement.lang = language
        document.title = t('title')
        for (const element of document.querySelectorAll('[data-text]')) element.textContent = t(element.dataset.text)
        const toggle = $('language')
        toggle.lang = language === 'en' ? 'zh-CN' : 'en'
        toggle.textContent = language === 'en' ? '简体中文' : 'English'
        $('node-name').textContent = $('confirm-name').textContent = node?.name || t('node')
        $('confirm-type').textContent = t(node?.kind === 'gateway' ? 'gateway' : 'relay')
        $('expires').textContent = expiresAt ? new Date(expiresAt).toLocaleTimeString(language, { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—'
        setStatus(statusKey, statusKind)
      }

      $('language').onclick = () => {
        language = language === 'en' ? 'zh-CN' : 'en'
        renderLanguage()
      }

      function setDot(kind) {
        $('dot').className = 'dot' + (kind ? ' ' + kind : '')
      }

      function b64url(bytes) {
        let binary = ''
        for (const byte of bytes) binary += String.fromCharCode(byte)
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      }

      function fromB64url(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/')
        const binary = atob(base64 + '='.repeat((4 - (base64.length % 4)) % 4))
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i)
        return bytes
      }

      function ulid() {
        const time = Date.now()
        let out = ''
        for (let i = 9; i >= 0; i -= 1) {
          out = CROCKFORD[time % 32] + out
        }
        const random = crypto.getRandomValues(new Uint8Array(16))
        for (const byte of random) out += CROCKFORD[byte % 32]
        return out
      }

      async function loadIdentity() {
        const stored = localStorage.getItem(IDENTITY_STORAGE)
        if (stored) {
          try {
            const parsed = JSON.parse(stored)
            if (typeof parsed.deviceId === 'string' && typeof parsed.identityKey === 'string') return parsed
          } catch {
            // Regenerate below.
          }
        }
        if (!crypto.subtle) throw new Error('当前浏览器不支持 WebCrypto，无法完成配对。')
        const keys = await crypto.subtle.generateKey({ name: 'X25519' }, true, ['deriveBits'])
        const spki = await crypto.subtle.exportKey('spki', keys.publicKey)
        const identity = { deviceId: ulid(), identityKey: b64url(new Uint8Array(spki)) }
        localStorage.setItem(IDENTITY_STORAGE, JSON.stringify(identity))
        return identity
      }

      function parseTicket() {
        if (!location.hash) return
        const params = new URLSearchParams(location.hash.slice(1))
        const ticket = params.get('ticket') || ''
        const hostIdentityKey = params.get('key') || ''
        if (params.get('v') !== '1' || !TICKET.test(ticket) || !IDENTITY_KEY.test(hostIdentityKey) ||
            b64url(fromB64url(hostIdentityKey)) !== hostIdentityKey) throw new Error(t('invalid'))
        return { ticket, hostIdentityKey }
      }

      async function fingerprintOf(identityKey) {
        const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', fromB64url(identityKey)))
        const fingerprint = Array.from(digest.subarray(0, 16), byte => byte.toString(16).padStart(2, '0')).join('')
        return { id: b64url(digest), fingerprint }
      }

      async function json(path, options) {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 10_000)
        try {
          const response = await fetch(path, { ...options, signal: controller.signal })
          const body = await response.json().catch(() => null)
          if (!response.ok) {
            const error = new Error(body?.error?.message || `HTTP ${response.status}`)
            error.code = body?.error?.code
            throw error
          }
          return body
        } finally {
          clearTimeout(timeout)
        }
      }

      const resultMessages = {
        TICKET_INVALID: 'expired', TICKET_EXPIRED: 'expired', TICKET_USED: 'expired',
        PAIRING_NOT_FOUND: 'expired', PAIRING_EXPIRED: 'expired', PAIRING_REJECTED: 'rejected',
        PAIRING_TOKEN_INVALID: 'expired', PAIRING_TOKEN_REQUIRED: 'expired',
        HOST_OFFLINE: 'hostOffline', DEVICE_IDENTITY_MISMATCH: 'deviceMismatch',
        INVALID_IDENTITY_KEY: 'identityUnavailable',
      }

      function resultMessage(error) {
        return Object.hasOwn(resultMessages, error?.code) ? resultMessages[error.code] : undefined
      }

      function showFailure(key) {
        $('confirm').hidden = true
        $('idle').hidden = false
        setStatus(key, 'bad')
      }

      function watchClaim(claim, target) {
        const path = '/v1/pairings/' + encodeURIComponent(claim.requestId)
        const headers = { 'x-pairing-token': claim.pairingToken }
        const approve = $('approve'), reject = $('reject'), retry = $('retry')
        let timer, busy = false, settled = false, queued, missedResponse = false

        function controls(canDecide, canRetry = false) {
          approve.disabled = reject.disabled = !canDecide
          retry.hidden = !canRetry
        }

        function stop(key) {
          settled = true
          clearTimeout(timer)
          document.removeEventListener('visibilitychange', resume)
          window.removeEventListener('online', resume)
          controls(false)
          if (key !== 'opening') { showFailure(key); return }
          $('confirm').hidden = true
          $('done').hidden = false
          setStatus(key, 'ok')
          location.replace('/')
        }

        function schedule() {
          if (!document.hidden) timer = setTimeout(update, 1500)
        }

        function resume() {
          clearTimeout(timer)
          if (document.hidden) queued = undefined
          else void update()
        }

        async function update() {
          if (settled || busy || document.hidden) return
          clearTimeout(timer)
          const decision = queued
          queued = undefined
          busy = true
          let waiting = false
          try {
            const result = await (decision ? json(path + '/' + decision, { method: 'POST', headers }) : json(path, { headers }))
            if (result?.requestId !== claim.requestId) throw new Error('Invalid pairing response')
            if (result.state === 'rejected') { stop('rejected'); return }
            if (result.state === 'complete' && result.complete === true) {
              if (missedResponse) {
                // A completed request can only issue its cookie once. An older cookie may target another host.
                if (document.hidden) return
                const { hosts } = await json('/v1/hosts').catch(error => {
                  if (error.code === 'AUTH_REQUIRED') return { hosts: [] }
                  throw error
                })
                if (hosts?.length !== 1 || hosts[0]?.hostId !== target.id) { stop('sessionMissing'); return }
              }
              stop('opening')
              return
            }
            switch (result.state) {
              case 'client_approved':
                queued = undefined
                controls(false)
                setStatus('waiting')
                break
              case 'pending':
              case 'host_approved':
                if (!queued) {
                  controls(true)
                  setStatus(missedResponse ? 'decisionPending' : 'compareStatus')
                }
                break
              default: throw new Error('Invalid pairing state')
            }
            missedResponse = false
            waiting = true
          } catch (error) {
            const terminal = resultMessage(error)
            if (terminal) {
              stop(terminal)
            } else {
              queued = undefined
              missedResponse = true
              controls(false, true)
              setStatus('checkFailed', 'bad')
            }
          } finally {
            busy = false
            if (!settled && queued) void update()
            else if (waiting) schedule()
          }
        }

        function decide(action) {
          if (approve.disabled || settled || document.hidden) return
          controls(false)
          queued = action
          setStatus(action === 'confirm' ? 'confirming' : 'rejecting')
          void update()
        }

        approve.onclick = () => decide('confirm')
        reject.onclick = () => decide('reject')
        retry.onclick = () => {
          if (retry.hidden || busy || settled || document.hidden) return
          controls(false)
          setStatus('checking')
          void update()
        }
        document.addEventListener('visibilitychange', resume)
        window.addEventListener('online', resume)
        controls(true)
        setStatus('compareStatus')
        schedule()
      }

      async function connect(context) {
        const retry = $('retry')
        retry.hidden = true
        retry.onclick = null
        setStatus('connecting')
        try {
          node = await json('/v1/config')
          if (!node || typeof node.name !== 'string') throw new Error('Invalid relay configuration')
          setDot('ok')
          renderLanguage()
        } catch {
          setDot('bad')
          showFailure('nodeUnavailable')
          retry.onclick = () => connect(context)
          retry.hidden = false
          return
        }
        if (!context) { setStatus(''); return }

        let identity, target
        try {
          identity = await loadIdentity()
          target = await fingerprintOf(context.hostIdentityKey)
        } catch {
          showFailure('identityUnavailable')
          return
        }
        $('idle').hidden = true
        $('confirm').hidden = false
        $('host-fp').textContent = target.fingerprint.toUpperCase().match(/.{4}/g).join('-')
        setStatus('requesting')

        let claim
        // Once the claim is sent, a reload must not submit the one-use ticket again.
        history.replaceState(null, '', location.pathname + location.search)
        try {
          claim = await json('/v1/pairings/claim', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              ticket: context.ticket,
              client: { deviceId: identity.deviceId, name: t('browser'), platform: 'web', identityKey: identity.identityKey },
            }),
          })
          if (typeof claim?.requestId !== 'string' || !claim.requestId ||
              typeof claim.pairingToken !== 'string' || !TICKET.test(claim.pairingToken) ||
              !Number.isSafeInteger(claim.expiresAt) || claim.expiresAt <= 0) throw new Error('Invalid pairing claim')
        } catch (error) {
          showFailure(resultMessage(error) || 'claimUnknown')
          return
        }
        if (claim.host?.hostId !== target.id || claim.host.fingerprint !== target.fingerprint) {
          showFailure('mismatch')
          return
        }
        expiresAt = claim.expiresAt
        renderLanguage()
        watchClaim(claim, target)
      }

      async function start() {
        renderLanguage()
        let context
        try { context = parseTicket() } catch {
          history.replaceState(null, '', location.pathname + location.search)
          showFailure('invalid')
          return
        }
        await connect(context)
      }

      start()
    </script>
  </body>
</html>
